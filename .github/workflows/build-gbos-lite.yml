name: Build GBOS86 Lite

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test workflow without downloading 7.7 GB (true/false)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space on runner
        uses: endersonmenezes/free-disk-space@v4
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check free disk and KVM
        run: |
          df -h
          ls -la /dev/kvm || echo "KVM check skipped"

      - name: Clone gbos-x86 upstream
        run: |
          git clone --depth 1 https://github.com/linuxkid473/gbos-x86.git gbos-src

      - name: Dry run check
        if: ${{ inputs.dry_run }}
        working-directory: gbos-src
        run: |
          GBOS_IPU6_CAMERA_BRIDGE=0 ./build.sh --dry-run

      - name: Build GBOS86 image (no IPU6 camera bridge)
        if: ${{ !inputs.dry_run }}
        working-directory: gbos-src
        run: |
          yes | GBOS_IPU6_CAMERA_BRIDGE=0 ./build.sh --standard
          ls -lh dist/

      - name: Clean temporary download cache
        if: ${{ !inputs.dry_run }}
        working-directory: gbos-src
        run: |
          rm -rf lapis recovery.zip *.zip || true
          df -h

      - name: Install QEMU and OVMF for cloud boot test
        if: ${{ !inputs.dry_run }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          sudo chmod 666 /dev/kvm || true

      - name: Boot GBOS86 on GitHub Cloud KVM and capture output
        if: ${{ !inputs.dry_run }}
        working-directory: gbos-src
        run: |
          IMG=$(ls dist/gbOS86-*.img | head -n 1)
          echo "Testing image: $IMG"

          OVMF_CODE=""
          for p in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do
            if [ -f "$p" ]; then
              OVMF_CODE="$p"
              break
            fi
          done
          echo "Using OVMF: $OVMF_CODE"

          qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -smp 4 \
            -m 6G \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive file="$IMG",format=raw,if=virtio \
            -vga std \
            -display none \
            -serial file:boot-serial.log \
            -monitor unix:/tmp/qemu-mon.sock,server,nowait \
            -no-reboot &
          QEMU_PID=$!

          sleep 90

          python3 -c '
          import socket, time
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect("/tmp/qemu-mon.sock")
          s.sendall(b"screendump boot-screen.ppm\n")
          time.sleep(2)
          s.sendall(b"quit\n")
          s.close()
          ' || true

          wait $QEMU_PID || true
          ls -lh boot-serial.log boot-screen.ppm || true

      - name: Upload boot logs and screenshot
        if: ${{ !inputs.dry_run && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gbos-cloud-boot-proof
          path: |
            gbos-src/boot-serial.log
            gbos-src/boot-screen.ppm
          if-no-files-found: warn
