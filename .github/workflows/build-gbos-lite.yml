name: Build GBOS86 Lite

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run --dry-run check only first"
        required: false
        default: "false"

jobs:
  build-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Free GitHub Runner Disk Space (~30GB reclaimed)
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false

      - name: Check Free Disk & RAM
        run: |
          df -h /
          free -h

      - name: Use Classic Docker Storage Driver
        run: |
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Install erofs-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils python3 curl git

      - name: Clone Official gbos-x86
        run: |
          git clone https://github.com/linuxkid473/gbos-x86.git
          cd gbos-x86
          chmod +x build.sh

      - name: Dry-Run Check First
        working-directory: gbos-x86
        run: ./build.sh --dry-run --standard

      - name: Stage A–E Build Standard Baseline First
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: gbos-x86
        run: ./build.sh --standard

      - name: Prune Safe Optional Apps (Keep Play Store + GMS + Desktop)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: gbos-x86
        run: |
          if [ -f lapis/parts/product.img ]; then
            cp -a lapis/parts lapis/parts.baseline
            mkdir -p work/product work/system_ext
            extract.erofs -i lapis/parts/product.img -x -o work/product
            extract.erofs -i lapis/parts/system_ext.img -x -o work/system_ext

            echo "=== Installed product apps before prune ==="
            ls -1 work/product/app work/product/priv-app || true

            # Remove only standalone bloat; KEEP Phonesky, GmsCore/PrebuiltGmsCore, GSF, SystemUI, Settings
            for app in YouTube Drive Docs Sheets Slides Keep Maps Photos Velvet GoogleRestore Turbo; do
              rm -rf "work/product/app/$app" "work/product/priv-app/$app"
            done

            mkfs.erofs -zlz4hc lapis/parts/product.img work/product && rm -rf work/product
            mkfs.erofs -zlz4hc lapis/parts/system_ext.img work/system_ext && rm -rf work/system_ext
            rm -rf lapis/parts.baseline

            # Re-run assembly using pruned partitions
            ./build.sh --standard
          fi
          ls -lh dist/

      - name: Split Output Image into <2GB Parts for Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: gbos-x86
        run: |
          mkdir -p release_parts
          IMG_FILE=$(ls dist/gbOS86-*.img | head -n 1)
          split -b 1900M "$IMG_FILE" release_parts/gbOS86-lite.part.
          sha256sum "$IMG_FILE" release_parts/gbOS86-lite.part.* > release_parts/SHA256SUMS.txt
          ls -lh release_parts/

      - name: Upload GBOS86 Lite Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-${{ github.run_number }}
          name: GBOS86 Lite Build #${{ github.run_number }}
          files: gbos-x86/release_parts/*
